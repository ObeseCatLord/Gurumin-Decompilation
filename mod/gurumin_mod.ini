; Gurumin mod settings (d3d9.dll next to game.exe). See docs/MOVIES_HD.md, docs/DISPLAY_MOD.md and
; docs/CAMERA_SHADOWS_JP.md.
[mod]
; Writes gurumin_mod.log next to this file.
log=1

[files]
; 1 = files under the folders below replace the game's files of the same name (sub-folders are only for sorting).
; A PNG named <texture>.png or <texture>.iti.png replaces <texture>.iti, at any size up to 2048x2048.
enabled=1
; Folders next to game.exe (or full paths), separated by commas; the first one wins when two have the same file.
folders=mod
; 1 = list every file the game opens in gurumin_files.log (to find the names to replace).
log=0

[movies]
; 1 = .mmv movies made at 2x or 4x their original size play at the original size with the extra detail.
hd=1

[display]
; Experimental, parked: any resolution and Hor+ widescreen (has glitches in the extra side areas). 0 = off.
enabled=0
; Any resolution. 0 = the desktop size.
width=1280
height=720
; 1 = wider screens see more at the sides (same vertical view); 0 = stretch the 4:3 picture.
hor_plus=1
; center = HUD and menus keep their 4:3 shape in the middle; stretch = stretched to the full width.
hud=center
; With hud=center: 2D drawn across the whole 4:3 width (fades, cutscene bars) still covers the whole screen.
stretch_fullscreen=1
; Size of the texture used for full-screen effects. 0 = the next power of two above the resolution.
effect_texture=0

[camera]
; Orbit camera (ported from Gurumin Enhanced Rendering). UNTESTED ON JP HARDWARE: nobody has run it on the Japanese
; game yet, so it is off by default. 1 = on. Works only while the game's own follow camera runs (not in events).
enabled=0
; Right stick (any XInput pad) turns the camera (degrees per second at full tilt) and tilts it up and down.
yaw_speed=120
pitch_speed=90
; Right-stick dead zone in XInput units (0..29490).
deadzone=8689
; 1 = reverse the turn (0 = stick right turns like the game's own "camera right" key) or the tilt.
invert_x=0
invert_y=0
; 1 = right stick up/down zooms instead of tilting.
stick_zoom=0
; Mouse orbit while this button or key is held (virtual-key code: 4 = middle button, 5/6 = side buttons); 0 = off.
; The right button is the game's own, so it is not the default.
mouse_button=0
; Degrees per pixel of mouse movement.
mouse_sensitivity=0.25
; Camera distance in percent of the game's own (60..250); saved here when you zoom in game.
distance=100
; Keys that zoom in and out (virtual-key codes; 0x21 = PageUp, 0x22 = PageDown).
zoom_in_key=0x21
zoom_out_key=0x22
; Mouse wheel zoom: 0 = never; 1 = when the game does not turn the camera with the wheel (its WROT option is off) or
; with Ctrl held; 2 = always.
wheel_zoom=1

[shadows]
; Higher-resolution dynamic shadows (ported from Gurumin Enhanced Rendering). UNTESTED ON JP HARDWARE: off by
; default. 1 = on. The game draws character shadows into ten 256x256 textures; this makes them `size` squared.
enabled=0
; 512, 1024 or 2048 (other values are rounded down to a power of two; at most 2048 and the card's texture limit).
size=2048
