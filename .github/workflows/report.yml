name: Progress report

# The original compilers (Visual C++ .NET 2002 for JP, Visual C++ 2013 for EN) and the game binaries cannot be used
# on GitHub-hosted runners, so the objdiff-format reports are generated locally with
#   python decomp/tools/build_all.py --report progress/jp/report.json --version jp      (JP APP.dll)
#   python decomp_en/tools/build_all.py --report progress/en/report.json                (EN game_en_steam.exe)
# and committed. This job publishes each as the artifact `<VERSION>_report` (jp_report, en_report) that ByteMatch
# reads from CI runs on master.
# The README meters progress/<VERSION>/progress.svg are written by the same commands; this job only warns when one is
# out of date (it never commits, so it cannot race the local loops' pushes).
# The report contains only function names, addresses, sizes and match percentages (no game bytes).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      VERSIONS: jp en
    steps:
      - uses: actions/checkout@v4

      - name: Check the reports
        run: |
          for VERSION in $VERSIONS; do
            python3 -c "import json,sys; v=sys.argv[1]; m=json.load(open(f'progress/{v}/report.json'))['measures']; print(v, m['matched_functions'], 'of', m['total_functions'], 'functions,', m['matched_code_percent'], '% of code matched')" "$VERSION"
          done

      - name: Check the README progress meters
        # Report only: a CI commit here would put origin ahead of the local loops' checkout and make their next
        # push fail. The meters are written locally by build_all together with each report.
        run: |
          for VERSION in $VERSIONS; do
            python3 decomp/tools/progress_svg.py progress/${VERSION}/report.json /tmp/${VERSION}.svg
            cmp -s /tmp/${VERSION}.svg progress/${VERSION}/progress.svg || echo "::warning::progress/${VERSION}/progress.svg is out of date with its report"
          done

      - name: Upload JP report
        uses: actions/upload-artifact@v4
        with:
          name: jp_report
          path: progress/jp/report.json

      - name: Upload EN report
        uses: actions/upload-artifact@v4
        with:
          name: en_report
          path: progress/en/report.json
