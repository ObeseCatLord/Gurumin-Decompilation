; Gurumin mod settings (d3d9.dll next to game.exe). See docs/MOVIES_HD.md and docs/DISPLAY_MOD.md.
[mod]
; Writes gurumin_mod.log next to this file.
log=1

[movies]
; 1 = .mmv movies made at 2x or 4x their original size play at the original size with the extra detail.
hd=1

[display]
; Experimental, parked: any resolution and Hor+ widescreen (has glitches in the extra side areas). 0 = off.
enabled=0
; Any resolution. 0 = the desktop size.
width=1280
height=720
; 1 = wider screens see more at the sides (same vertical view); 0 = stretch the 4:3 picture.
hor_plus=1
; center = HUD and menus keep their 4:3 shape in the middle; stretch = stretched to the full width.
hud=center
; With hud=center: 2D drawn across the whole 4:3 width (fades, cutscene bars) still covers the whole screen.
stretch_fullscreen=1
; Size of the texture used for full-screen effects. 0 = the next power of two above the resolution.
effect_texture=0
